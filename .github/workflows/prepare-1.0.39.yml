name: Prepare Courses 1.0.39 diagnostic button alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-1.0.39.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply diagnostic button alignment and bump version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = '1.0.38'
          new = '1.0.39'

          # Match Forms exactly for the three diagnostic actions.
          p = Path('component/admin/tmpl/information/default.php')
          text = p.read_text(encoding='utf-8')
          old_class = 'class="btn dci-btn-outline"'
          if text.count(old_class) != 3:
              raise SystemExit(f'Expected 3 diagnostic custom buttons, found {text.count(old_class)}')
          text = text.replace(old_class, 'class="btn btn-outline-secondary"')
          p.write_text(text, encoding='utf-8')

          version_files = [
              'component/decarocourses.xml',
              'package/pkg_decarocourses.xml',
              'component/admin/src/Helper/InformationHelper.php',
              'component/admin/src/Helper/UiHelper.php',
              'component/media/joomla.asset.json',
          ]
          for name in version_files:
              f = Path(name)
              data = f.read_text(encoding='utf-8')
              if old not in data:
                  raise SystemExit('Version marker missing: ' + name)
              f.write_text(data.replace(old, new), encoding='utf-8')

          manifest = Path('component/decarocourses.xml')
          data = manifest.read_text(encoding='utf-8')
          data = data.replace(
              '<!-- Release 1.0.38: final Information typography and vertical rhythm alignment with Forms. -->',
              '<!-- Release 1.0.39: diagnostic action buttons aligned with Forms. -->'
          )
          manifest.write_text(data, encoding='utf-8')

          Path('component/admin/sql/updates/mysql/1.0.39.sql').write_text(
              '-- Schema unchanged in 1.0.39.\n', encoding='utf-8'
          )

          readme = Path('README.md')
          data = readme.read_text(encoding='utf-8')
          data = data.replace('- Versione corrente: `1.0.38`', '- Versione corrente: `1.0.39`', 1)
          data = data.replace('- ZIP componente: `com_decarocourses_1.0.38.zip`', '- ZIP componente: `com_decarocourses_1.0.39.zip`', 1)
          data = data.replace('- ZIP completo: `pkg_decarocourses_1.0.38.zip`', '- ZIP completo: `pkg_decarocourses_1.0.39.zip`', 1)
          note = '''\n## 1.0.39\n\nUniformate le tre azioni finali della Diagnostica nella vista **Informazioni** a Forms: `Copia diagnostica`, `Scarica .txt` e `Release GitHub` usano ora direttamente le classi Joomla `btn btn-outline-secondary`, eliminando la resa come semplici testi che restava in Courses 1.0.38. Nessuna modifica a Corsi, Edizioni, dati, database o logica applicativa.\n'''
          marker = '\n## 1.0.38\n'
          if '## 1.0.39' not in data:
              if marker not in data:
                  raise SystemExit('README marker missing')
              data = data.replace(marker, note + marker, 1)
          readme.write_text(data, encoding='utf-8')

          Path('.github/workflows/prepare-1.0.39.yml').unlink()
          PY

      - name: Validate prepared sources
        shell: bash
        run: |
          set -euo pipefail
          find component -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r 'foreach (["component/decarocourses.xml","package/pkg_decarocourses.xml"] as $f) { if (simplexml_load_file($f) === false) exit(1); }'
          php -r '$x=json_decode(file_get_contents("component/media/joomla.asset.json"), true); if (!is_array($x)) exit(1);'
          grep -F '<version>1.0.39</version>' component/decarocourses.xml
          test "$(grep -o 'class="btn btn-outline-secondary"' component/admin/tmpl/information/default.php | wc -l)" -ge 3
          ! grep -F 'class="btn dci-btn-outline"' component/admin/tmpl/information/default.php

      - name: Commit prepared release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Courses 1.0.39 diagnostic button alignment"
          git push
