name: Prepare Courses 1.0.43 diagnostics feedback fix

on:
  push:
    branches: [main]
    paths:
      - "tools/release-1.0.43-feedback-gap.sh"
      - ".github/workflows/release-1.0.43-feedback-gap.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply validated source changes
        shell: bash
        run: |
          set -euo pipefail
          bash tools/release-1.0.43-feedback-gap.sh

      - name: Commit coherent 1.0.43 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add component/media/css/information.css \
                  component/media/joomla.asset.json \
                  component/decarocourses.xml \
                  component/admin/sql/updates/mysql/1.0.43.sql \
                  package/pkg_decarocourses.xml \
                  README.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Fix Courses 1.0.43 diagnostics feedback gap"
          git push
