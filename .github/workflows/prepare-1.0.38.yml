name: Prepare Courses 1.0.38 Information final typography alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-1.0.38.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Information alignment and bump version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = '1.0.37'
          new = '1.0.38'

          css_path = Path('component/media/css/information.css')
          css = css_path.read_text(encoding='utf-8')

          old_eyebrow = '''.dci-card .dc-eyebrow,
          .dci-page-header .dc-eyebrow {
            font-size: 11px;
            font-weight: 800;
            line-height: normal;
            letter-spacing: .085em;
          }'''
          new_eyebrow = '''.dci-card .dc-eyebrow,
          .dci-page-header .dc-eyebrow {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .085em;
          }'''
          if old_eyebrow not in css:
              raise SystemExit('Eyebrow CSS marker not found')
          css = css.replace(old_eyebrow, new_eyebrow, 1)

          old_intro = '''.dci-card-intro {
            margin: -2px 0 12px;
            color: var(--dc-muted);
            font-size: 12px;
          }'''
          new_intro = '''.dci-card-intro {
            margin: -2px 0 12px;
            color: var(--dc-muted);
            font-size: 13px;
            line-height: 1.55;
          }'''
          if old_intro not in css:
              raise SystemExit('Card intro CSS marker not found')
          css = css.replace(old_intro, new_intro, 1)

          old_h1 = '''.dci-page-header h1 {
            margin: 4px 0 5px;
            color: var(--dc-text);
            font: 700 30px/1.16 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            letter-spacing: -.02em;
          }'''
          new_h1 = '''.dci-page-header h1 {
            margin: 4px 0 5px;
            color: var(--dc-text);
            font-size: clamp(26px, 3vw, 30px);
            font-weight: 700;
            line-height: 1.16;
            letter-spacing: -.02em;
          }'''
          if old_h1 not in css:
              raise SystemExit('Page H1 CSS marker not found')
          css = css.replace(old_h1, new_h1, 1)

          css_path.write_text(css, encoding='utf-8')

          version_files = [
              'component/decarocourses.xml',
              'package/pkg_decarocourses.xml',
              'component/admin/src/Helper/InformationHelper.php',
              'component/admin/src/Helper/UiHelper.php',
              'component/media/joomla.asset.json',
          ]
          for filename in version_files:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Version marker missing in {filename}')
              text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          component_manifest = Path('component/decarocourses.xml')
          text = component_manifest.read_text(encoding='utf-8')
          text = text.replace(
              '<!-- Release 1.0.38: final Information alignment and language key fix. -->',
              '<!-- Release 1.0.38: final Information typography and vertical rhythm alignment with Forms. -->'
          )
          component_manifest.write_text(text, encoding='utf-8')

          Path('component/admin/sql/updates/mysql/1.0.38.sql').write_text(
              '-- Schema unchanged in 1.0.38.\n',
              encoding='utf-8'
          )

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('- Versione corrente: `1.0.37`', '- Versione corrente: `1.0.38`', 1)
          text = text.replace('- ZIP componente: `com_decarocourses_1.0.37.zip`', '- ZIP componente: `com_decarocourses_1.0.38.zip`', 1)
          text = text.replace('- ZIP completo: `pkg_decarocourses_1.0.37.zip`', '- ZIP completo: `pkg_decarocourses_1.0.38.zip`', 1)
          marker = '\n## 1.0.37\n'
          note = '''
          ## 1.0.38

          Rifinitura finale della pagina **Informazioni** dopo il confronto affiancato reale con **Forms 1.3.71**. Rimosso il `line-height: normal` locale dagli eyebrow (`INFORMAZIONI`, `PRODOTTO`, `AMBIENTE`, ecc.), così il ritmo verticale eredita lo stesso comportamento di Forms; il testo introduttivo delle card passa a 13 px con line-height 1.55 e il titolo pagina usa lo stesso `clamp(26px, 3vw, 30px)` di Forms per mantenere coerenza anche su tablet. Nessuna modifica a Corsi, Edizioni, database, ACL o logica applicativa.
          '''
          if '## 1.0.38' not in text:
              if marker not in text:
                  raise SystemExit('README changelog marker not found')
              text = text.replace(marker, '\n' + note.strip() + '\n' + marker, 1)
          readme.write_text(text, encoding='utf-8')

          Path('.github/workflows/prepare-1.0.38.yml').unlink()
          PY

      - name: Validate prepared sources
        shell: bash
        run: |
          set -euo pipefail
          php -l component/admin/src/Helper/InformationHelper.php
          php -l component/admin/src/Helper/UiHelper.php
          php -r 'foreach (["component/decarocourses.xml", "package/pkg_decarocourses.xml"] as $f) { if (simplexml_load_file($f) === false) exit(1); }'
          php -r '$x=json_decode(file_get_contents("component/media/joomla.asset.json"), true); if (!is_array($x)) exit(1);'
          grep -F '<version>1.0.38</version>' component/decarocourses.xml
          grep -F '<version>1.0.38</version>' package/pkg_decarocourses.xml
          grep -F "public const VERSION = '1.0.38';" component/admin/src/Helper/InformationHelper.php
          grep -F 'font-size: clamp(26px, 3vw, 30px);' component/media/css/information.css
          grep -F 'font-size: 13px;' component/media/css/information.css
          if grep -Fq 'line-height: normal;' component/media/css/information.css; then
            echo 'Unexpected line-height: normal remains in Information CSS'
            exit 1
          fi

      - name: Commit prepared release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Courses 1.0.38 Information alignment"
          git push
