name: Prepare Courses 1.0.37 final Information alignment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-1.0.37.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply release preparation
        run: python3 tools/prepare_1_0_37.py

      - name: Validate prepared sources
        shell: bash
        run: |
          set -euo pipefail
          php -l component/admin/src/Helper/InformationHelper.php
          php -l component/admin/src/Helper/UiHelper.php
          php -r 'foreach (["component/decarocourses.xml","package/pkg_decarocourses.xml"] as $f) { if (simplexml_load_file($f) === false) exit(1); }'
          php -r '$x=json_decode(file_get_contents("component/media/joomla.asset.json"), true); if (!is_array($x)) exit(1);'
          grep -F 'COM_DECAROCOURSES_INFORMATION="Informazioni"' component/admin/language/it-IT/com_decarocourses.information.ini
          grep -F 'grid-template-columns: minmax(145px, 42%)' component/media/css/information.css
          grep -F '<version>1.0.37</version>' component/decarocourses.xml

      - name: Commit prepared release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Courses 1.0.37 final Information alignment"
          git push
