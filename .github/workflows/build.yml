name: Build and publish Courses package

on:
  push:
    branches: [main]
    paths:
      - "component/**"
      - "package/**"
      - "tools/build.php"
      - "tools/publish-update.php"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(php -r '$x=simplexml_load_file("package/pkg_decarocourses.xml"); echo trim((string)$x->version);')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate PHP XML and JSON sources
        shell: bash
        run: |
          set -euo pipefail
          find component tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          while IFS= read -r -d '' FILE; do
            php -r 'libxml_use_internal_errors(true); if (simplexml_load_file($argv[1]) === false) { fwrite(STDERR, "XML non valido: {$argv[1]}\n"); exit(1); }' "$FILE"
          done < <(find component package -type f -name '*.xml' -print0)
          php -r '$data=json_decode(file_get_contents("component/media/joomla.asset.json"), true); if (!is_array($data) || json_last_error() !== JSON_ERROR_NONE) { fwrite(STDERR, "joomla.asset.json non valido\n"); exit(1); }'

      - name: Build ZIP
        run: php tools/build.php

      - name: Verify installable packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          test -f "dist/com_decarocourses_${VERSION}.zip"
          test -f "dist/pkg_decarocourses_${VERSION}.zip"
          unzip -t "dist/com_decarocourses_${VERSION}.zip"
          unzip -t "dist/pkg_decarocourses_${VERSION}.zip"
          unzip -p "dist/com_decarocourses_${VERSION}.zip" decarocourses.xml | grep -F "<version>${VERSION}</version>"
          unzip -p "dist/pkg_decarocourses_${VERSION}.zip" pkg_decarocourses.xml | grep -F "<version>${VERSION}</version>"
          unzip -l "dist/com_decarocourses_${VERSION}.zip" | grep -F "media/joomla.asset.json"
          unzip -l "dist/com_decarocourses_${VERSION}.zip" | grep -F "media/css/design-system.css"
          unzip -p "dist/com_decarocourses_${VERSION}.zip" media/joomla.asset.json | grep -F '"com_decarocourses.design"'

      - name: Publish update channel files
        run: php tools/publish-update.php

      - name: Commit repository release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/${VERSION}" updates/pkg_decarocourses.xml
          if git diff --cached --quiet; then
            echo "Release ${VERSION} already published with identical files."
            exit 0
          fi
          git commit -m "Publish Courses ${VERSION} update package"
          git push

      - name: Upload Joomla packages
        uses: actions/upload-artifact@v4
        with:
          name: decarocourses-${{ steps.version.outputs.version }}
          path: |
            dist/com_decarocourses_${{ steps.version.outputs.version }}.zip
            dist/pkg_decarocourses_${{ steps.version.outputs.version }}.zip
