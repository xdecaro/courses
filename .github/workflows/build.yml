name: Build and publish Courses package

on:
  push:
    branches: [main]
    paths:
      - "component/**"
      - "package/**"
      - "plugins/**"
      - "tools/build.php"
      - "tools/publish-update.php"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(php -r '$x=simplexml_load_file("package/pkg_decarocourses.xml"); echo trim((string)$x->version);')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate PHP XML JSON and schema marker
        shell: bash
        run: |
          set -euo pipefail
          find component plugins tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          while IFS= read -r -d '' FILE; do
            php -r 'libxml_use_internal_errors(true); if (simplexml_load_file($argv[1]) === false) { fwrite(STDERR, "XML non valido: {$argv[1]}\n"); exit(1); }' "$FILE"
          done < <(find component package plugins -type f -name '*.xml' -print0)
          php -r '$data=json_decode(file_get_contents("component/media/joomla.asset.json"), true); if (!is_array($data) || json_last_error() !== JSON_ERROR_NONE) { fwrite(STDERR, "joomla.asset.json non valido\n"); exit(1); }'
          VERSION="${{ steps.version.outputs.version }}"
          test -f "component/admin/sql/updates/mysql/${VERSION}.sql"

      - name: Build ZIP
        run: php tools/build.php

      - name: Verify installable packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          COMPONENT_ZIP="dist/com_decarocourses_${VERSION}.zip"
          PACKAGE_ZIP="dist/pkg_decarocourses_${VERSION}.zip"
          test -f "$COMPONENT_ZIP"
          test -f "$PACKAGE_ZIP"
          unzip -t "$COMPONENT_ZIP"
          unzip -t "$PACKAGE_ZIP"
          unzip -p "$COMPONENT_ZIP" decarocourses.xml | grep -F "<version>${VERSION}</version>"
          unzip -p "$PACKAGE_ZIP" pkg_decarocourses.xml | grep -F "<version>${VERSION}</version>"
          unzip -l "$COMPONENT_ZIP" | grep -F "media/joomla.asset.json"
          unzip -l "$COMPONENT_ZIP" | grep -F "media/css/design-system.css"
          unzip -l "$COMPONENT_ZIP" | grep -F "media/css/editions.css"
          unzip -l "$COMPONENT_ZIP" | grep -F "admin/sql/updates/mysql/${VERSION}.sql"
          unzip -p "$COMPONENT_ZIP" media/joomla.asset.json | grep -F '"com_decarocourses.design"'
          unzip -p "$COMPONENT_ZIP" media/joomla.asset.json | grep -F '"com_decarocourses.editions"'

          if [ "$VERSION" = "1.3.0" ]; then
            unzip -l "$COMPONENT_ZIP" | grep -F "admin/tmpl/information/core.php"
            unzip -l "$COMPONENT_ZIP" | grep -F "media/css/core-bridge.css"
            unzip -p "$COMPONENT_ZIP" media/joomla.asset.json | grep -F '"com_decarocourses.core-bridge"'
            unzip -p "$COMPONENT_ZIP" admin/tmpl/information/core.php | grep -F 'xdecaro-scope courses-core-scope'
            unzip -p "$COMPONENT_ZIP" admin/src/View/Information/HtmlView.php | grep -F 'xdecaro\Core\Asset\AssetService'
            unzip -p "$COMPONENT_ZIP" admin/src/Service/CoreIntegrationService.php | grep -F 'xdecaro\Core\Integration\EntityReference'
            ! unzip -p "$COMPONENT_ZIP" admin/src/View/Information/HtmlView.php | grep -F 'Xdecaro\Core\'
            ! unzip -p "$COMPONENT_ZIP" admin/src/Service/CoreIntegrationService.php | grep -F 'Xdecaro\Core\'
            unzip -p "$COMPONENT_ZIP" media/css/core-bridge.css | grep -F -- '--dc-surface: var(--xdecaro-color-surface);'
          fi

      - name: Publish update channel files
        run: php tools/publish-update.php

      - name: Commit repository release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/${VERSION}" updates/pkg_decarocourses.xml
          if git diff --cached --quiet; then
            echo "Release ${VERSION} already published with identical files."
          else
            git commit -m "Publish Courses ${VERSION} update package"
            git push
          fi

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${VERSION} already exists; refusing to replace immutable artifacts."
            exit 0
          fi

          RELEASE_DIR="releases/${VERSION}"
          PACKAGE="${RELEASE_DIR}/pkg_decarocourses_${VERSION}.zip"
          ANALYTICS="plg_xdecaroanalytics_decarocourses_${VERSION}.zip"
          TASK="plg_task_decarocourses_${VERSION}.zip"
          unzip -p "$PACKAGE" "packages/${ANALYTICS}" > "/tmp/${ANALYTICS}"
          unzip -p "$PACKAGE" "packages/${TASK}" > "/tmp/${TASK}"
          unzip -t "/tmp/${ANALYTICS}" >/dev/null
          unzip -t "/tmp/${TASK}" >/dev/null
          {
            sha256sum "${RELEASE_DIR}/com_decarocourses_${VERSION}.zip"
            sha256sum "${RELEASE_DIR}/pkg_decarocourses_${VERSION}.zip"
            sha256sum "/tmp/${ANALYTICS}"
            sha256sum "/tmp/${TASK}"
          } | sed -E 's#(  )(.*/)?#\1#' > /tmp/SHA256SUMS.txt

          gh release create "v${VERSION}" \
            "${RELEASE_DIR}/com_decarocourses_${VERSION}.zip" \
            "${RELEASE_DIR}/pkg_decarocourses_${VERSION}.zip" \
            "/tmp/${ANALYTICS}" \
            "/tmp/${TASK}" \
            "/tmp/SHA256SUMS.txt" \
            --target main \
            --title "Courses by xdecaro ${VERSION}" \
            --notes "Courses ${VERSION}. Joomla packages are published from the immutable repository update channel; SHA-256 checksums are attached. See CHANGELOG.md for version details."

      - name: Upload Joomla packages
        uses: actions/upload-artifact@v4
        with:
          name: decarocourses-${{ steps.version.outputs.version }}
          path: |
            dist/com_decarocourses_${{ steps.version.outputs.version }}.zip
            dist/pkg_decarocourses_${{ steps.version.outputs.version }}.zip
